# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit PR 리뷰 설정. 리뷰 기준 본문은 REVIEW.md에 있다.
# AI 리뷰는 사람 리뷰 전의 1차 점검이다. 병합 승인은 사람이 한다.

language: ko-KR
tone_instructions: "리뷰 대상은 처음 개발하는 팀원이다. 지적마다 왜 문제인지, 어떻게 고치면 되는지, 근거 문서 위치를 짧게 적는다. 칭찬이나 요약은 길게 쓰지 않는다."

reviews:
  # chill: 중요한 지적 위주. 지적이 너무 많으면 quiet로 낮춘다.
  profile: chill
  # AI는 승인하거나 변경 요청으로 병합을 막지 않는다.
  auto_approvals:
    enabled: false

  high_level_summary: true
  # 요약을 PR 본문이 아니라 리뷰 댓글(walkthrough)에 넣는다. 팀이 쓰는 PR 본문 형식을 건드리지 않기 위함이다.
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  # 4인 팀이고 리뷰 짝이 정해져 있어서(docs/roles.md) 리뷰어 추천은 끈다.
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/.omc/**"

  path_instructions:
    - path: "src/backend/domain/**"
      instructions: |
        공통 도메인이다. 타입·금액·위치 표현만 둔다.
        DB·HTTP·RPC·UI 의존성이나 분석 알고리즘이 들어오면 지적한다.
    - path: "src/backend/analyzer/**"
      instructions: |
        분석 엔진이다. DB·HTTP·RPC를 직접 부르지 않는다.
        같은 입력이면 같은 결과가 나와야 한다(정렬·ID 규칙 고정).
        탐색 순서, 상한과 truncated 사유, 패턴 창 [시작, 시작+600초) 경계를 확인한다.
    - path: "src/backend/indexer/**"
      instructions: |
        수집기다. 허용된 토큰 컨트랙트의 Transfer 이벤트만 수집한다.
        종료 블록은 finalized 이하, 청크 저장과 체크포인트는 한 트랜잭션,
        RPC 범위 오류 시 청크 분할, 재개 시 경계 블록 해시 대조를 확인한다.
    - path: "src/backend/api-server/**"
      instructions: |
        API 서버다. 응답은 contracts/openapi.json과 같아야 하고 항상 { data, meta, error } 모양이다.
        저장소는 Repository 인터페이스로만 쓰고 SQL·테이블 구조에 직접 의존하지 않는다.
        분석 전과 응답 전에 데이터셋 상태(READY)와 버전을 확인한다.
    - path: "src/backend/api-server/contracts/**"
      instructions: |
        API 규격이다. openapi.json과 samples/가 함께 바뀌었는지 확인한다.
        필드 삭제·이름·타입·필수 여부·정렬·상태 의미가 바뀌면 깨지는 변경이므로 PR 제목에 '!'가 있어야 한다.
    - path: "src/web/**"
      instructions: |
        웹 화면이다. API 타입은 contracts/openapi.json과 같아야 한다.
        금액과 블록 번호는 문자열 그대로 다루고 Number로 바꾸지 않는다.
        FIXTURE 데이터에는 Explorer 링크를 만들지 않는다.
        조건을 바꾼 뒤 도착한 이전 응답은 버린다. 키보드와 표만으로 근거를 확인할 수 있어야 한다.
    - path: "docs/**"
      instructions: |
        기획 문서다. 다른 문서나 코드와 내용이 어긋나는지만 본다. 문체·맞춤법은 지적하지 않는다.

  pre_merge_checks:
    # Squash merge라서 PR 제목이 main의 커밋 제목이 된다(docs/conventions.md).
    title:
      mode: warning
      requirements: |
        Conventional Commits 형식 '종류(범위): 설명'을 따른다.
        종류: feat, fix, refactor, perf, test, docs, build, ci, style, chore, revert.
        범위: data, engine, api, web, contract, infra.
        규격을 깨는 변경은 범위 뒤에 '!'를 붙인다.
        설명은 한국어, 50자 안팎, 마침표 없이 쓰고 '수정'·'업데이트'처럼 내용 없는 말은 쓰지 않는다.
    # 일반적인 본문 검사는 끄고, 팀의 본문 형식(.github/pull_request_template.md)은 REVIEW.md로 본다.
    description:
      mode: "off"

  tools:
    # 비밀값 유출 검사
    gitleaks:
      enabled: true
    # openapi.json의 깨지는 변경 감지
    oasdiff:
      enabled: true
    golangci-lint:
      enabled: true
    eslint:
      enabled: true
    # 한국어 문서에서 영어 기준 문법 지적이 많이 나와 끈다.
    languagetool:
      enabled: false

chat:
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
    # REVIEW.md, CLAUDE.md, AGENTS.md는 기본값으로 읽는다. 아래는 그 밖의 기준 문서다.
    filePatterns:
      - "docs/correctness-security.md"
      - "docs/architecture.md"
      - files: "src/backend/api-server/contracts/README.md"
        applyTo: "src/backend/api-server/**,src/web/**"
