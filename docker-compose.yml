# 로컬 실행 환경. 레포 루트에서 실행한다(Docker Compose v2.24 이상).
#   docker compose up --build -d           API(8080)·Swagger UI(8081)·PostgreSQL(5432)
#   docker compose up -d postgres          PostgreSQL만
#   docker compose --profile debug up -d   위에 더해 pgweb(8082): 브라우저에서 DB 내용 보기
#   docker compose down                    끄기(DB 데이터는 볼륨에 남는다)
#   docker compose down -v                 DB 데이터까지 지우기
#
# DB 계정은 src/database/.env에서 읽는다. 처음 한 번: cp src/database/.env.example src/database/.env
# init.d의 SQL은 데이터 볼륨이 비어 있을 때(처음 올릴 때)만 실행된다. 스키마를 바꿨으면 down -v 뒤 다시 올린다.
# 포트는 이 컴퓨터(127.0.0.1)에서만 열린다. 이미 쓰는 포트면 바꿔서 띄운다. 예: POSTGRES_PORT=5433 docker compose up -d postgres
# API는 아직 Fixture로 응답한다. DB 저장소(담당 1)가 붙으면 api에 DB 접속 설정을 더하고, 웹(담당 4)은 준비되면 서비스를 추가한다.

services:
  api:
    build:
      context: src/backend
      dockerfile: api-server/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    env_file:
      - path: src/backend/api-server/.env
        required: false
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /contracts/openapi.json
    volumes:
      - ./src/backend/api-server/contracts:/contracts:ro
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    env_file:
      - path: src/database/.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/init.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # 처음 올릴 때 init.d를 실행하는 동안에는 TCP를 열지 않는다. TCP로 확인해서 스키마까지 만들어진 뒤 healthy가 된다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:0.17.0
    profiles: [debug]
    env_file:
      - path: src/database/.env
        required: false
    # src/database/.env의 계정으로 postgres에 바로 접속한다. $$는 compose가 아니라 컨테이너 셸이 값을 채우게 한다.
    entrypoint:
      - sh
      - -c
      - >-
        exec /usr/bin/pgweb --bind=0.0.0.0 --listen=8081
        --host=postgres --port=5432 --ssl=disable
        --user="$${POSTGRES_USER:-postgres}"
        --pass="$${POSTGRES_PASSWORD}"
        --db="$${POSTGRES_DB:-$${POSTGRES_USER:-postgres}}"
    ports:
      - "127.0.0.1:${PGWEB_PORT:-8082}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
